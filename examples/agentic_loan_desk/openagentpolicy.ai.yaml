application:
  id: agentic-loan-desk
  name: Agentic Loan Desk (AI compiler)
  environment: demo

runtime:
  default_agent_id: loan-agent

inventory:
  provider: file
  path: ./inventory.yaml
  # Tools are declared both here and via @policy_tool; trust the static file and
  # ignore annotation-derived overrides (silences merge-conflict warnings).
  conflict_strategy: prefer_static

policies:
  provider: directory
  path: ./policies
  support_english: true
  compile_on_startup: true
  # Force the LLM translator. AI output is only auto-compiled when the
  # deterministic rule-based compiler independently agrees; otherwise it is
  # surfaced as needs_review and not enforced.
  english_compiler: ai
  ai:
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY

compiler:
  enabled: true

traces:
  enabled: true
  store:
    provider: local
    path: ./openagentpolicy_traces

enforcement:
  default_action: allow
  on_policy_error: allow_with_warning
  audit_enabled: true
