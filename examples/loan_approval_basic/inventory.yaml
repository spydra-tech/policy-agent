application:
  id: loan-approval-app
  name: Loan Approval Basic
  environment: demo

agents:
  - id: loan-agent
    name: Loan Agent
    description: Handles loan approval workflow

tools:
  - id: approve_loan
    name: Approve Loan
    description: Approve a loan application
    side_effect: true
    risk_level: high
    arguments:
      application_id:
        type: string
        description: Loan application identifier
      approved_amount:
        type: number
        description: Loan principal amount
        aliases:
          - approved amount
      approval_mode:
        type: string
        description: Approval workflow mode
        aliases:
          - approval mode
        allowed_values:
          - auto
          - manual
  - id: send_to_human_review
    name: Send to Human Review
    description: Escalate an application to a human reviewer
    side_effect: true
    risk_level: medium
    arguments:
      application_id:
        type: string
      reason:
        type: string
        description: Why the case was escalated
